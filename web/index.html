<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="local-token" content="__LOCAL_TOKEN__">
<title>시험지 워터마크</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script>
</head><body><main>
<header><span class="brand">시험지 워터마크</span><a href="/dashboard" class="local">접속 현황 →</a></header>
<h1>PDF를 선택하면 바로 만듭니다.</h1>
<p class="description">문제 끝 QR · 진한 워터마크 · 지문 박스 테두리 교체</p>
<label class="issue-field">발급 대상 <span>수험번호·시험지 번호 · 선택</span><input id="issuance-ref" maxlength="200" placeholder="예: A-023"></label>
<label class="dropzone" id="dropzone" tabindex="0"><input id="pdf-file" type="file" accept="application/pdf,.pdf">
<span class="plus" aria-hidden="true">+</span><strong id="file-title">PDF 선택</strong><span id="file-detail">또는 여기에 파일 놓기 · 최대 25MB / 100쪽</span></label>
<div id="status" role="status" aria-live="polite">파일은 이 컴퓨터에서 처리됩니다. QR 접속은 로컬 CSV에 기록됩니다.</div>
<progress id="progress" max="100" value="0" aria-label="생성 진행률" hidden></progress>
<button id="retry" class="secondary" hidden>다시 시도</button>
<section id="result" hidden aria-label="생성 결과"><div class="result-heading"><h2>생성 완료</h2><span id="result-stats"></span></div>
<a class="primary" id="download-pdf" download>PDF 내려받기 ↓</a>
<details><summary>첫 페이지 확인</summary><img id="result-preview" alt="생성한 PDF의 첫 페이지"></details>
<a class="record" id="download-manifest" download>처리 기록 JSON</a></section>
<footer>실험용 · AI 차단 효과는 아직 확인되지 않았습니다.<br>원본은 보존합니다. 인쇄 전 전체 페이지와 용지 배율을 확인하세요.</footer>
</main></body></html>
